<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Footer</title>
    <style>
      * {
        font-family: "Roboto", Arial, Tahoma, sans-serif;
        margin: 0;
        padding: 0;
      }

      .container-center {
        display: flex;
        justify-content: space-between;
      }

      footer {
        background-color: black;
        color: white;
        padding: 30px 0;
        display: flex;
        justify-content: center;
      }

      footer .container-center {
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        width: 100%;
      }

      footer .container-center div {
        display: flex;
        flex-direction: column;
        text-align: center;
      }

      footer h2,
      footer h3 {
        font-size: 28px;
        margin: 15px 0;
        color: rgb(253, 197, 91);
      }

      footer p,
      footer a {
        margin: 7px 0;
        display: block;
        color: white;
        text-decoration: none;
      }

      footer a:hover {
        color: gray;
      }

      @media (max-width: 800px) {
        footer .container-center {
          flex-direction: column;
        }
        footer .container-center div {
          width: 100%;
        }
      }

      .footer-social {
        max-width: 100%;
        grid-column: 1 / -1;
        background-color: black;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        padding: 10px;
      }

      .iconos-rrss {
        width: 35px;
        height: 35px;
        margin: 0 10px;
        background: rgb(253, 197, 91);
        border-radius: 12px;
      }

      p.copyright {
        font-size: 12px;
        display: flex;
        justify-content: center;
        color: white;
        background-color: black;
        padding: 10px;
      }
    </style>
  </head>

  <body>
    <footer>
      <div class="container-center">
        <div>
          <h3>Planes</h3>
          <a href="planes.html">Ocio</a>
          <a href="planes.html">Restaurantes</a>
        </div>
        <div>
          <h3>Rutas</h3>
          <a href="rutas.html">En Madrid</a>
          <a href="rutas.html">Fuera de Madrid</a>
        </div>
        <div>
          <h3>Viajes</h3>
          <a href="viajes.html">España</a>
          <a href="viajes.html">Extranjero</a>
        </div>
      </div>
    </footer>

    <div class="footer-social">
      <a
        href="https://instagram.com/codigofotoviajero"
        target="_blank"
        aria-label="Instagram"
      >
        <img
          src="imagenes/redes_sociales/icon-instagram-48.png"
          class="iconos-rrss"
          id="icono-instagram"
          alt="Instagram"
        />
      </a>
      <a
        href="https://tiktok.com/@codigofotoviajero"
        target="_blank"
        aria-label="TikTok"
      >
        <img
          src="imagenes/redes_sociales/icon-tiktok-48.png"
          class="iconos-rrss"
          id="icono-tiktok"
          alt="TikTok"
        />
      </a>
      <a href="mailto:contacto@codigofotoviajero.com" aria-label="Email">
        <img
          src="imagenes/redes_sociales/icon_email.png"
          class="iconos-rrss"
          id="icono-email"
          alt="Email"
        />
      </a>
    </div>
    <p class="copyright">
      &copy; Código Fotoviajero 2025 Todos los Derechos Reservados
    </p>
  </body>
</html>
