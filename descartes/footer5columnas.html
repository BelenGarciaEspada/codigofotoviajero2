<!DOCTYPE html>
<html lang="es">
  <head>
    <style>
      * {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      .container-center {
        display: flex; /* Se define un contenedor flex */
        justify-content: space-between; /* Los elementos hijos se distribuyen con espacio entre ellos */
      }

      footer {
        background-color: black;
        color: white;
        padding: 50px 0;
        display: flex; /* Se convierte en contenedor flex */
        justify-content: center; /* Centra los elementos hijos horizontalmente */
      }

      footer .container-center {
        max-width: 1200px;
        /*margin: 0 auto; No hace falta porque hemos puesto en el contenedor padre justify-content: center */
        display: flex; /* Se define un contenedor flex para organizar los elementos */
        justify-content: space-between; /* Los elementos se distribuyen con espacio entre ellos */
        flex-wrap: wrap; /* Permite que los elementos se envuelvan en múltiples líneas si es necesario */
        width: 100%;
      }

      footer .container-center div {
        display: flex; /* Contenedor flex para organizar los elementos hijos verticalmente */
        flex-direction: column; /* Organiza los elementos en una columna */
        text-align: center;
      }

      footer h2,
      footer h3 {
        font-size: 28px;
        margin: 30px 0;
      }

      footer p,
      footer a {
        margin: 7px 0;
        display: block;
        color: white;
        text-decoration: none;
      }

      footer a:hover {
        color: gray;
      }

      @media (max-width: 800px) {
        nav a {
          display: none;
        }
        nav button:nth-child(5) {
          display: none;
        }
        nav button + button {
          display: flex;
        }
        header .container-center {
          margin: 0px;
          padding: 0px;
          width: 100%;
        }
        .newsletter-fullwidth {
          box-sizing: border-box;
        }
        .newsletter-content {
          max-width: 800px;
          border-radius: 0px;
          background-color: #f9f9f9;
          box-shadow: 0 0px 0px;
          padding: 30px;
        }
        footer .container-center {
          flex-direction: column; /* Cambia la dirección del contenedor flex a columna en pantallas pequeñas */
        }
        footer .container-center div {
          width: 100%; /* Los elementos hijos ocupan el 100% del ancho disponible */
        }
      }
    </style>
  </head>

</html>
